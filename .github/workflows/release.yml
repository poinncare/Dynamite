name: Release Dynamite

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  REPOSITORY: poinncare/Dynamite
  FEED_URL: https://raw.githubusercontent.com/poinncare/Dynamite/main/DynamiteApp/updater/appcast.xml

jobs:
  package:
    name: Build, sign and publish
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4.2.2
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a semantic version tag such as v1.0.0, got $TAG"
            exit 1
          }
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Release app
        working-directory: DynamiteApp
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project Dynamite.xcodeproj \
            -scheme Dynamite \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/DynamiteDerivedData" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p Release
          ditto \
            "$RUNNER_TEMP/DynamiteDerivedData/Build/Products/Release/Dynamite.app" \
            "Release/Dynamite.app"
          python3 -m pip install --require-hashes \
            -r DynamiteApp/Configuration/dmg/requirements.txt
          DynamiteApp/Configuration/dmg/create_dmg.sh \
            Release/Dynamite.app \
            Release/Dynamite.dmg \
            Dynamite
          shasum -a 256 Release/Dynamite.dmg

      - name: Generate signed Sparkle appcast
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.PRIVATE_SPARKLE_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo "::error::PRIVATE_SPARKLE_KEY is not configured"
            exit 1
          }
          GENERATE_APPCAST="$(find "$RUNNER_TEMP/DynamiteDerivedData/SourcePackages/artifacts/sparkle" -type f -path '*/bin/generate_appcast' -perm -111 -print -quit)"
          [[ -x "$GENERATE_APPCAST" ]] || {
            echo "::error::Sparkle generate_appcast was not found"
            exit 1
          }
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$GENERATE_APPCAST" \
            --ed-key-file - \
            --link "https://github.com/${REPOSITORY}/releases" \
            --download-url-prefix "https://github.com/${REPOSITORY}/releases/download/v${VERSION}/" \
            --embed-release-notes \
            -o "$RUNNER_TEMP/appcast.xml" \
            Release
          test -s "$RUNNER_TEMP/appcast.xml"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" Release/Dynamite.dmg \
            --repo "$REPOSITORY" \
            --title "Dynamite v${VERSION}" \
            --generate-notes

      - name: Update appcast on main
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/appcast.xml.published"
          git fetch origin main
          git checkout main
          cp "$RUNNER_TEMP/appcast.xml.published" DynamiteApp/updater/appcast.xml
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add DynamiteApp/updater/appcast.xml
          git commit -m "Update appcast for ${TAG}" || true
          git push origin main
